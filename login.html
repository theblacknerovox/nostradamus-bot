<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nostradamus — Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#020408;
  --deep:#060d14;
  --panel:#0a141f;
  --border:rgba(0,255,136,.1);
  --border2:rgba(0,255,136,.25);
  --acid:#00ff88;
  --acid2:#00d4ff;
  --red:#ff3860;
  --text:#c8d8e8;
  --muted:#3a5268;
  --muted2:#1a2d3d;
  --font-display:'Bebas Neue',sans-serif;
  --font-mono:'DM Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}

html,body{
  height:100%;background:var(--void);
  color:var(--text);font-family:var(--font-body);
  overflow:hidden;
}

/* Animated background */
.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 80%, rgba(0,255,136,.04) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 20%, rgba(0,212,255,.03) 0%, transparent 60%),
    var(--void);
}

/* Grid lines */
.bg::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(0,255,136,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,.03) 1px, transparent 1px);
  background-size:60px 60px;
  animation:gridShift 20s linear infinite;
}

@keyframes gridShift{
  0%{background-position:0 0}
  100%{background-position:60px 60px}
}

/* Floating particles */
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.particle{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--acid);opacity:0;
  animation:float var(--d,8s) var(--delay,0s) ease-in-out infinite;
}
@keyframes float{
  0%{opacity:0;transform:translateY(100vh) translateX(0)}
  10%{opacity:.6}
  90%{opacity:.2}
  100%{opacity:0;transform:translateY(-20px) translateX(var(--dx,20px))}
}

/* Main layout */
.wrap{
  position:relative;z-index:2;
  height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}

/* Card */
.card{
  width:100%;max-width:440px;
  background:linear-gradient(135deg, rgba(10,20,31,.95) 0%, rgba(6,13,20,.98) 100%);
  border:1px solid var(--border2);
  border-radius:4px;
  box-shadow:
    0 0 0 1px rgba(0,255,136,.05),
    0 40px 80px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(0,255,136,.1);
  overflow:hidden;
  animation:cardIn .6s cubic-bezier(.16,1,.3,1) both;
}

@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Top accent bar */
.card-accent{
  height:3px;
  background:linear-gradient(90deg, transparent, var(--acid), var(--acid2), transparent);
  background-size:200% 100%;
  animation:accentSlide 3s ease-in-out infinite;
}
@keyframes accentSlide{
  0%,100%{background-position:0% 0%}
  50%{background-position:100% 0%}
}

.card-body{padding:40px}

/* Logo */
.logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:36px}

.logo-hex{
  position:relative;width:48px;height:48px;flex-shrink:0;
}
.logo-hex svg{width:100%;height:100%}

.logo-text-wrap{}
.logo-name{
  font-family:var(--font-display);
  font-size:28px;letter-spacing:2px;
  color:var(--acid);
  line-height:1;
}
.logo-tagline{
  font-family:var(--font-mono);
  font-size:10px;color:var(--muted);
  letter-spacing:2px;margin-top:3px;
}

/* Status indicator */
.status-row{
  display:flex;align-items:center;gap:8px;
  margin-bottom:32px;
  font-family:var(--font-mono);font-size:11px;color:var(--muted);
}
.status-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--acid);
  box-shadow:0 0 8px var(--acid);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Form */
.field-label{
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;display:block;
}

.field-wrap{position:relative;margin-bottom:24px}

.field-input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--font-mono);font-size:15px;
  padding:14px 48px 14px 16px;
  border-radius:3px;outline:none;
  transition:all .2s;letter-spacing:2px;
}
.field-input::placeholder{color:var(--muted);letter-spacing:1px}
.field-input:focus{
  border-color:var(--acid);
  background:rgba(0,255,136,.03);
  box-shadow:0 0 0 3px rgba(0,255,136,.08), inset 0 0 20px rgba(0,255,136,.03);
}

.field-icon{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);cursor:pointer;transition:color .2s;font-size:16px;
  user-select:none;
}
.field-icon:hover{color:var(--acid)}

/* Error */
.error-msg{
  display:none;align-items:center;gap:8px;
  background:rgba(255,56,96,.08);border:1px solid rgba(255,56,96,.25);
  border-radius:3px;padding:10px 14px;margin-bottom:16px;
  font-family:var(--font-mono);font-size:11px;color:var(--red);
}
.error-msg.show{display:flex}

/* Submit button */
.btn-submit{
  width:100%;position:relative;overflow:hidden;
  background:transparent;
  border:1px solid var(--acid);
  color:var(--acid);
  font-family:var(--font-display);font-size:18px;letter-spacing:3px;
  padding:16px;border-radius:3px;cursor:pointer;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn-submit::before{
  content:'';position:absolute;inset:0;
  background:var(--acid);transform:translateX(-101%);
  transition:transform .3s cubic-bezier(.16,1,.3,1);
}
.btn-submit:hover::before{transform:translateX(0)}
.btn-submit:hover{color:#020408}
.btn-submit span{position:relative;z-index:1}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.btn-submit:disabled::before{transform:translateX(-101%)}

/* Spinner */
.spin{display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Footer */
.card-footer{
  padding:16px 40px;
  border-top:1px solid rgba(255,255,255,.04);
  font-family:var(--font-mono);font-size:10px;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;
}

/* Mobile */
@media(max-width:480px){
  .card-body{padding:28px 24px}
  .logo-name{font-size:24px}
  .card-footer{padding:14px 24px}
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- Particles -->
<div class="particles" id="particles"></div>

<div class="wrap">
  <div class="card">
    <div class="card-accent"></div>
    <div class="card-body">

      <!-- Logo -->
      <div class="logo-wrap">
        <div class="logo-hex">
          <svg viewBox="0 0 48 48" fill="none">
            <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="#00ff88" stroke-width="1.5" fill="rgba(0,255,136,.05)"/>
            <polygon points="24,12 34,18 34,30 24,36 14,30 14,18" stroke="#00ff88" stroke-width=".8" fill="rgba(0,255,136,.03)" opacity=".5"/>
            <circle cx="24" cy="24" r="4" fill="#00ff88"/>
            <line x1="24" y1="4" x2="24" y2="12" stroke="#00ff88" stroke-width=".8" opacity=".4"/>
            <line x1="24" y1="36" x2="24" y2="44" stroke="#00ff88" stroke-width=".8" opacity=".4"/>
          </svg>
        </div>
        <div class="logo-text-wrap">
          <div class="logo-name">NOSTRADAMUS</div>
          <div class="logo-tagline">TRADING BOT v4.0 — AI POWERED</div>
        </div>
      </div>

      <!-- Status -->
      <div class="status-row">
        <div class="status-dot"></div>
        <span>SISTEMA ONLINE — AUTENTICAÇÃO REQUERIDA</span>
      </div>

      <!-- Error -->
      <div class="error-msg" id="error-msg">
        <span>⚠</span><span id="error-text">Senha incorreta</span>
      </div>

      <!-- Field -->
      <label class="field-label">Senha de acesso</label>
      <div class="field-wrap">
        <input class="field-input" id="pw" type="password" placeholder="••••••••••••" autocomplete="current-password">
        <span class="field-icon" id="toggle-pw" onclick="togglePw()">👁</span>
      </div>

      <!-- Submit -->
      <button class="btn-submit" id="btn" onclick="doLogin()">
        <span id="btn-text">ACESSAR SISTEMA</span>
      </button>

    </div>
    <div class="card-footer">
      <span>NOSTRADAMUS © 2026</span>
      <span>ACESSO RESTRITO</span>
    </div>
  </div>
</div>

<script>
// Particles
const wrap = document.getElementById('particles');
for(let i=0;i<25;i++){
  const p=document.createElement('div');
  p.className='particle';
  const left=Math.random()*100;
  p.style.cssText=`left:${left}%;--d:${6+Math.random()*10}s;--delay:${Math.random()*8}s;--dx:${(Math.random()-0.5)*100}px`;
  wrap.appendChild(p);
}

// Toggle password
function togglePw(){
  const pw=document.getElementById('pw');
  pw.type=pw.type==='password'?'text':'password';
}

// Enter key
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

// Auto-check token
const tok=localStorage.getItem('nst_token');
if(tok){
  fetch('/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok})})
  .then(r=>r.json()).then(d=>{if(d.valid)window.location.href='/'}).catch(()=>{});
}

async function doLogin(){
  const pw=document.getElementById('pw').value;
  const btn=document.getElementById('btn');
  const btnText=document.getElementById('btn-text');
  const err=document.getElementById('error-msg');
  const errText=document.getElementById('error-text');
  if(!pw){showErr('Digite sua senha para continuar');return;}
  btn.disabled=true;
  btnText.innerHTML='<span class="spin">⟳</span> VERIFICANDO...';
  err.classList.remove('show');
  try{
    const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const d=await r.json();
    if(r.ok&&d.token){
      localStorage.setItem('nst_token',d.token);
      btnText.innerHTML='✓ ACESSO CONCEDIDO';
      setTimeout(()=>window.location.href='/',600);
      return;
    }
    showErr('Senha incorreta. Tente novamente.');
  }catch(e){showErr('Erro de conexão com o servidor.');}
  btn.disabled=false;btnText.innerHTML='ACESSAR SISTEMA';
}

function showErr(msg){
  const err=document.getElementById('error-msg');
  document.getElementById('error-text').textContent=msg;
  err.classList.add('show');
}
</script>
</body>
</html>
